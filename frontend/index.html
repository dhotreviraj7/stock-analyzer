<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indian Stock Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a24;
    --border: #262a38;
    --text: #e6e8ef;
    --muted: #8a8fa3;
    --accent: #4f9dff;
    --green: #2ecc71;
    --red: #ef5350;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;
  }
  input, select, button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
  }
  input { flex: 1; min-width: 160px; }
  button {
    background: var(--accent);
    border: none;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .panel h2 { margin: 0 0 14px; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat { background: #1e2230; border-radius: 8px; padding: 12px; }
  .stat .label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .stat .value { font-size: 18px; font-weight: 700; }
  .positive { color: var(--green); }
  .negative { color: var(--red); }
  .disclaimer {
    font-size: 12px; color: var(--muted); border-top: 1px solid var(--border);
    padding-top: 10px; margin-top: 10px; line-height: 1.5;
  }
  canvas { max-height: 360px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab-btn {
    background: transparent; border: 1px solid var(--border); font-weight: 500;
  }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); }
  #error { color: var(--red); font-size: 13px; margin-top: 8px; display: none; }
  #loading { color: var(--muted); font-size: 13px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<header>
  <h1>📈 Indian Stock Analyzer</h1>
  <p>Technical analysis, backtesting &amp; illustrative predictions for NSE/BSE stocks — not financial advice.</p>
</header>

<div class="container">
  <div class="controls">
    <input id="symbolInput" type="text" placeholder="Symbol e.g. RELIANCE, TCS, INFY" value="RELIANCE">
    <select id="periodSelect">
      <option value="6mo">6 Months</option>
      <option value="1y" selected>1 Year</option>
      <option value="2y">2 Years</option>
      <option value="5y">5 Years</option>
    </select>
    <button onclick="loadAll()">Analyze</button>
  </div>
  <div id="loading">Loading data…</div>
  <div id="error"></div>

  <div class="panel">
    <h2>Price Chart</h2>
    <canvas id="priceChart"></canvas>
  </div>

  <div class="panel">
    <h2>RSI (14)</h2>
    <canvas id="rsiChart"></canvas>
  </div>

  <div class="panel">
    <h2>MACD</h2>
    <canvas id="macdChart"></canvas>
  </div>

  <div class="panel">
    <div class="tabs">
      <button class="tab-btn active" id="tabSma" onclick="setStrategy('sma')">SMA Crossover</button>
      <button class="tab-btn" id="tabRsi" onclick="setStrategy('rsi')">RSI Mean Reversion</button>
    </div>
    <h2>Backtest Results</h2>
    <div class="grid" id="backtestStats"></div>
    <canvas id="backtestChart"></canvas>
  </div>

  <div class="panel">
    <h2>Next-Day Direction (Illustrative Model)</h2>
    <div class="grid" id="predictionStats"></div>
    <div class="disclaimer" id="predictionDisclaimer"></div>
  </div>
</div>

<script>
const API_BASE = "https://illus-verse.onrender.com";
let currentStrategy = "sma";
let priceChart, rsiChart, macdChart, backtestChart;

function showError(msg) {
  const el = document.getElementById("error");
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}
function setLoading(on) {
  document.getElementById("loading").style.display = on ? "block" : "none";
}

function setStrategy(strategy) {
  currentStrategy = strategy;
  document.getElementById("tabSma").classList.toggle("active", strategy === "sma");
  document.getElementById("tabRsi").classList.toggle("active", strategy === "rsi");
  loadBacktest();
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `Request failed (${res.status})`);
  }
  return res.json();
}

function destroyChart(chart) { if (chart) chart.destroy(); }

async function loadAll() {
  showError("");
  setLoading(true);
  const symbol = document.getElementById("symbolInput").value.trim();
  const period = document.getElementById("periodSelect").value;
  if (!symbol) { showError("Enter a symbol first."); setLoading(false); return; }

  try {
    await Promise.all([
      loadIndicators(symbol, period),
      loadBacktest(),
      loadPrediction(symbol, period),
    ]);
  } catch (err) {
    showError(err.message + " — is the backend running at " + API_BASE + "?");
  } finally {
    setLoading(false);
  }
}

async function loadIndicators(symbol, period) {
  const data = await fetchJSON(`${API_BASE}/api/indicators/${symbol}?period=${period}`);

  destroyChart(priceChart);
  priceChart = new Chart(document.getElementById("priceChart"), {
    type: "line",
    data: {
      labels: data.dates,
      datasets: [
        { label: "Close", data: data.close, borderColor: "#4f9dff", borderWidth: 1.5, pointRadius: 0 },
        { label: "SMA 20", data: data.sma_20, borderColor: "#2ecc71", borderWidth: 1, pointRadius: 0 },
        { label: "SMA 50", data: data.sma_50, borderColor: "#f39c12", borderWidth: 1, pointRadius: 0 },
        { label: "BB Upper", data: data.bb_upper, borderColor: "#555b6e", borderWidth: 1, pointRadius: 0, borderDash: [4,4] },
        { label: "BB Lower", data: data.bb_lower, borderColor: "#555b6e", borderWidth: 1, pointRadius: 0, borderDash: [4,4] },
      ],
    },
    options: chartOptions(),
  });

  destroyChart(rsiChart);
  rsiChart = new Chart(document.getElementById("rsiChart"), {
    type: "line",
    data: { labels: data.dates, datasets: [{ label: "RSI 14", data: data.rsi_14, borderColor: "#e67e22", borderWidth: 1.5, pointRadius: 0 }] },
    options: chartOptions({ min: 0, max: 100 }),
  });

  destroyChart(macdChart);
  macdChart = new Chart(document.getElementById("macdChart"), {
    type: "line",
    data: {
      labels: data.dates,
      datasets: [
        { label: "MACD", data: data.macd, borderColor: "#4f9dff", borderWidth: 1.2, pointRadius: 0 },
        { label: "Signal", data: data.macd_signal, borderColor: "#ef5350", borderWidth: 1.2, pointRadius: 0 },
      ],
    },
    options: chartOptions(),
  });
}

async function loadBacktest() {
  const symbol = document.getElementById("symbolInput").value.trim();
  const period = document.getElementById("periodSelect").value;
  const data = await fetchJSON(`${API_BASE}/api/backtest/${symbol}?strategy=${currentStrategy}&period=${period}`);

  const statsEl = document.getElementById("backtestStats");
  const cls = (v) => (v >= 0 ? "positive" : "negative");
  statsEl.innerHTML = `
    <div class="stat"><div class="label">Strategy</div><div class="value">${data.strategy}</div></div>
    <div class="stat"><div class="label">Strategy Return</div><div class="value ${cls(data.total_return_pct)}">${data.total_return_pct}%</div></div>
    <div class="stat"><div class="label">Buy &amp; Hold Return</div><div class="value ${cls(data.buy_hold_return_pct)}">${data.buy_hold_return_pct}%</div></div>
    <div class="stat"><div class="label">Max Drawdown</div><div class="value negative">${data.max_drawdown_pct}%</div></div>
    <div class="stat"><div class="label">Sharpe Ratio</div><div class="value">${data.sharpe_ratio}</div></div>
    <div class="stat"><div class="label">Trades</div><div class="value">${data.num_trades}</div></div>
  `;

  destroyChart(backtestChart);
  backtestChart = new Chart(document.getElementById("backtestChart"), {
    type: "line",
    data: {
      labels: data.dates,
      datasets: [
        { label: "Strategy Equity", data: data.equity_curve, borderColor: "#4f9dff", borderWidth: 1.5, pointRadius: 0 },
        { label: "Buy & Hold Equity", data: data.buy_hold_curve, borderColor: "#8a8fa3", borderWidth: 1.5, pointRadius: 0 },
      ],
    },
    options: chartOptions(),
  });
}

async function loadPrediction(symbol, period) {
  const data = await fetchJSON(`${API_BASE}/api/predict/${symbol}?period=${period}`);
  const statsEl = document.getElementById("predictionStats");
  if (data.error) {
    statsEl.innerHTML = `<div class="stat"><div class="label">Note</div><div class="value">${data.error}</div></div>`;
    document.getElementById("predictionDisclaimer").textContent = "";
    return;
  }
  statsEl.innerHTML = `
    <div class="stat"><div class="label">Predicted Direction</div><div class="value ${data.prediction === 'UP' ? 'positive' : 'negative'}">${data.prediction}</div></div>
    <div class="stat"><div class="label">Model Confidence</div><div class="value">${data.confidence_pct}%</div></div>
    <div class="stat"><div class="label">Backtested Accuracy</div><div class="value">${data.backtested_accuracy_pct}%</div></div>
  `;
  document.getElementById("predictionDisclaimer").textContent = data.disclaimer;
}

function chartOptions(yOverrides = {}) {
  return {
    responsive: true,
    interaction: { mode: "index", intersect: false },
    scales: {
      x: { ticks: { color: "#8a8fa3", maxTicksLimit: 10 }, grid: { color: "#262a38" } },
      y: { ticks: { color: "#8a8fa3" }, grid: { color: "#262a38" }, ...yOverrides },
    },
    plugins: { legend: { labels: { color: "#e6e8ef" } } },
  };
}

loadAll();
</script>
</body>
</html>
